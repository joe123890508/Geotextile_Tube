<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>115年度沙腸袋驗收</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css"/>
  <script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
    }
    .form-container {
      width: 100%;
      border: 1px solid #ccc;
      padding: 1em;
      margin: 1em auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    #container {
      min-height: 250px;
      margin: 10px 0;
    }
    #map {
      width: 100%;
      height: 90vh;
      min-height: 400px;
    }
    .image-wrapper {
      width: 100%;
      max-width: 100%;
      aspect-ratio: 16/9;
      margin: 10px 0;
    }
    #preview-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }
    #preview-image.visible {
      display: block;
    }
    @media (max-width: 576px) {
      select, input, textarea, button {
        width: 100% !important;
      }
    }
    .form-preview-value {
      margin: 0.2em 0;
      white-space:pre-wrap;
    }
    .form-preview-value-people {
      white-space: pre-wrap;
      width: 100vw;
      position: relative;
      box-sizing: border-box;
    }
    .basemaps {
      padding: 4px;
    }
    .basemaps.closed .basemap {
      display: none;
    }
    .basemaps.closed .basemap.alt {
      display: inline-block;
    }
    .basemaps.closed .basemap.alt h4 {
      display: none;
    }
    .basemap {
      display: inline-block;
      cursor: pointer;
    }
    .basemap.active img {
      border-color: orange;
      box-shadow: 2px 2px 4px #000;
    }
    .basemap img {
      width: 64px;
      border: 2px solid #FFF;
      margin: 0 2px;
      border-radius: 40px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.65)
    }
    #feature-info table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      margin-top: 10px;
    }
    #feature-info th,
    #feature-info td {
      padding: 8px 12px;
      border: 1px solid #dee2e6;
      vertical-align: top;
    }
    #feature-info th {
      background-color: #f8f9fa;
      color: #343a40;
      text-align: left;
      width: 30%;
      font-weight: 600;
    }
    #feature-info td {
      text-align: right;
    }
    #feature-info tr:hover {
      background-color: #e9f5ff;
    }
    .leaflet-control-layers label {
      display: flex;
      align-items: center;
      padding: 6px 8px;
      cursor: pointer;
      border-radius: 6px;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    .leaflet-control-layers label:hover {
      background-color: #f0f8ff;
    }
    .leaflet-control-layers input[type="checkbox"],
    .leaflet-control-layers input[type="radio"] {
      margin-right: 10px;
      transform: scale(1.2);
      cursor: pointer;
    }
    .leaflet-control-layers label span {
      font-size: 14px;
      color: #333;
    }
    .leaflet-control-layers-list {
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .leaflet-control-layers-list::-webkit-scrollbar {
      width: 6px;
    }
    .leaflet-control-layers-list::-webkit-scrollbar-thumb {
      background-color: #4a90e2;
      border-radius: 3px;
    }
    .modal-body{
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
    }
    #theta-viewer {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      width: 90% !important;
      max-width: 100%;
      height: 75vh !important;
    }
    .camera-marker-wrapper {
      background: transparent;
      border: none;
    }
    .camera-marker {
      --size: 40px;
      position: relative;
      width: var(--size);
      height: calc(var(--size) * 0.64);
      background: #2d3748;
      border-radius: calc(var(--size) * 0.12);
      border: calc(var(--size) * 0.04) solid #1a202c;
      box-sizing: border-box;
    }
    .camera-top {
      position: absolute;
      top: calc(var(--size) * -0.16);
      left: calc(var(--size) * 0.16);
      width: calc(var(--size) * 0.36);
      height: calc(var(--size) * 0.2);
      background: #4a5568;
      border-radius: calc(var(--size) * 0.08) calc(var(--size) * 0.08) 0 0;
    }
    .camera-lens {
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--size) * 0.36);
      height: calc(var(--size) * 0.36);
      transform: translate(-50%, -50%);
      background: #1a202c;
      border: calc(var(--size) * 0.06) solid #a0aec0;
      border-radius: 50%;
      box-sizing: border-box;
    }
    .camera-lens::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--size) * 0.12);
      height: calc(var(--size) * 0.12);
      transform: translate(-50%, -50%);
      background: #63b3ed;
      border-radius: 50%;
    }
    .camera-flash {
      position: absolute;
      top: calc(var(--size) * 0.12);
      right: calc(var(--size) * 0.12);
      width: calc(var(--size) * 0.12);
      height: calc(var(--size) * 0.12);
      background: #f6e05e;
      border-radius: 50%;
    }
    #threejs-container {
      width: 100%;
      height: 70vh;
      background: #222;
      border-radius: 6px;
      position: relative;
    }
  </style>
</head>

<body>
  <h1 class="text-center my-3">115年度沙腸袋驗收</h1>
  <div id="container" class="mt-3">
    <div id="map">
      <div class="modal fade" id="featureModal" tabindex="-1" role="dialog">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title text-primary" id="feature-title1"></h4>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="feature-info"></div>
            <div class="modal-footer"></div>
          </div>
        </div>
      </div>
      <div class="modal fade" id="point" tabindex="-1" role="dialog">
        <div class="modal-dialog style-dialog" style="max-width: 85%;">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title text-primary" id="feature-title2"></h4>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" style="max-width: 100%;"></div>
            <div class="modal-footer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
  var map = L.map('map', {center: [22.699, 120.453], zoom: 17, zoomControl: true, renderer: L.canvas()});
  
  let controlLayers = L.control.layers(null, null, { collapsed: true }).addTo(map);

  function bindModalMapControl(modalId) {
    const modalEl = document.getElementById(modalId);
    if (!modalEl) return;
    modalEl.addEventListener('shown.bs.modal', () => {
      map.dragging.disable();
      map.scrollWheelZoom.disable();
      map.doubleClickZoom.disable();
      map.boxZoom.disable();
      map.keyboard.disable();
      if (map.touchZoom) map.touchZoom.disable();
      if (map.tap) map.tap.disable();
    });
    modalEl.addEventListener('hidden.bs.modal', () => {
      map.dragging.enable();
      map.scrollWheelZoom.enable();
      map.doubleClickZoom.enable();
      map.boxZoom.enable();
      map.keyboard.enable();
      if (map.touchZoom) map.touchZoom.enable();
      if (map.tap) map.tap.enable();
    });
  }
  bindModalMapControl('featureModal');
  bindModalMapControl('point');

  L.control.scale({position: 'bottomleft'}).addTo(map);

  var basemaps = [
    L.tileLayer('https://wmts.nlsc.gov.tw/wmts/{id}/default/GoogleMapsCompatible/{z}/{y}/{x}.png', { maxZoom: 20, id: 'EMAP', label: '通用電子地圖' }),
    L.tileLayer('https://wmts.nlsc.gov.tw/wmts/{id}/default/GoogleMapsCompatible/{z}/{y}/{x}.png', { maxZoom: 20, id: 'PHOTO2', label: '正射影像圖' }),
    L.tileLayer('https://wmts.nlsc.gov.tw/wmts/{id}/default/GoogleMapsCompatible/{z}/{y}/{x}.png', { maxZoom: 20, id: 'LUIMAP', label: '土地使用調查' })
  ];

  // 底圖切換器外掛
  L.Control.Basemaps = L.Control.extend({
    options: {position: "bottomright", tileX: 0, tileY: 0, tileZ: 0, basemaps: []},
    onAdd: function(map) {
      var container = L.DomUtil.create("div", "basemaps leaflet-control closed");
      L.DomEvent.disableClickPropagation(container);
      if (!L.Browser.touch) L.DomEvent.disableScrollPropagation(container);
      
      this.options.basemaps.forEach((layer, idx) => {
        var cls = "basemap";
        if (idx === 0) { this.basemap = layer; map.addLayer(layer); cls += " active"; }
        else if (idx === 1) { cls += " alt"; }
        
        var url = L.Util.template(layer._url, L.extend({s: layer._getSubdomain({x:this.options.tileX, y:this.options.tileY}), x: this.options.tileX, y: this.options.tileY, z: this.options.tileZ}, layer.options));
        var box = L.DomUtil.create("div", cls, container);
        var img = L.DomUtil.create("img", null, box);
        img.src = url;
        if (layer.options.label) img.title = layer.options.label;

        L.DomEvent.on(box, "click", () => {
          if (this.options.basemaps.length > 2 && L.Browser.mobile && L.DomUtil.hasClass(container, "closed")) {
            L.DomUtil.removeClass(container, "closed");
          } else if (layer !== this.basemap) {
            map.removeLayer(this.basemap);
            map.addLayer(layer);
            layer.bringToBack();
            this.basemap = layer;
            L.DomUtil.removeClass(container.getElementsByClassName("basemap active")[0], "active");
            L.DomUtil.addClass(box, "active");
            var altIdx = (idx + 1) % this.options.basemaps.length;
            L.DomUtil.removeClass(container.getElementsByClassName("basemap alt")[0], "alt");
            L.DomUtil.addClass(container.getElementsByClassName("basemap")[altIdx], "alt");
            L.DomUtil.addClass(container, "closed");
          }
        });
      });
      if (this.options.basemaps.length > 2 && !L.Browser.mobile) {
        L.DomEvent.on(container, "mouseenter", () => L.DomUtil.removeClass(container, "closed"));
        L.DomEvent.on(container, "mouseleave", () => L.DomUtil.addClass(container, "closed"));
      }
      return container;
    }
  });
  L.control.basemaps = function(options) { return new L.Control.Basemaps(options); };
  map.addControl(L.control.basemaps({ basemaps: basemaps, tileX: 854, tileY: 444, tileZ: 10 }));

  // 載入主點位資料
  async function loadAllData() {
    try {
      const [resLayer, resPoint, resColor] = await Promise.all([
        fetch("./layer.json"), fetch("./point.geojson"), fetch("./color.json")
      ]);
      const compareData = await resLayer.json();
      const geojson = await resPoint.json();
      const colorMap = await resColor.json();
      processGeoJson(geojson, compareData, colorMap);
    } catch (error) {
      console.error("Data loading error:", error);
      alert("資料載入失敗，請確認網路連線或檔案路徑！");
    }
  }

  function processGeoJson(json, compareData, colorMap) {
    let layersByCategory = {};
    json.features.forEach(feature => {
      let rawLayer = feature.properties.layer;
      feature.properties.layer = compareData[rawLayer] || `圖層 ${rawLayer}`;
    });

    json.features.forEach(feature => {
      let category = feature.properties.layer;
      if (!layersByCategory[category]) {
        let color = colorMap[category] || "black";
        layersByCategory[category] = L.geoJSON(null, {
          pointToLayer: (f, latlng) => {
            const maker = L.circleMarker(latlng, {
              radius: 7, fillColor: color, color: "#fff", weight: 1.5, opacity: 1, fillOpacity: 0.8
            })
            maker.options.tolerance = 15;
            return maker;
          },
          onEachFeature: (f, layer) => {
            layer.on("click", () => {
              let table = '<table class="table table-sm table-striped mb-0">';
              for (let key in f.properties) {
                table += `<tr><th style="width:40%">${key}</th><td>${f.properties[key]}</td></tr>`;
              }
              table += '</table>';
              document.getElementById("feature-info").innerHTML = table;
              document.getElementById("feature-title1").innerHTML = `點號：${f.properties.P || '未命名'}`;
              bootstrap.Modal.getOrCreateInstance(document.getElementById('featureModal')).show();
            });
          }
        });
        let nameWithIcon = `<span style="display:inline-block; width:12px; height:12px; background:${color}; margin-right:6px; border-radius:50%; border: 1px solid #666; vertical-align: middle;"></span>${category}`;
        controlLayers.addOverlay(layersByCategory[category], nameWithIcon);
        map.addLayer(layersByCategory[category]);
      }
      layersByCategory[category].addData(feature);
    });
  }
  loadAllData();

  L.control.fullscreen({ position: 'topleft', forceSeparateButton: true, forcePseudoFullscreen: true }).addTo(map);
  // 載入丁壩圖層
  fetch("./bar.geojson")
  .then(res => { if (!res.ok) throw new Error(); return res.json(); })
    .then(data => {
      const barLayer = L.geoJSON(data, {
        style: () => ({ fillColor: 'orange', weight: 2, opacity: 1, color: 'black', fillOpacity: 0.6 }),
        onEachFeature: (f, layer) => {
          if (f.properties && f.properties.名稱) layer.bindTooltip(f.properties.名稱, { sticky: true });
        }
      }).addTo(map);
      barLayer.bringToBack(); // 推到最下層
    
    }).catch(() => console.warn("丁壩圖層 (bar.geojson) 載入失敗"));

  function createCameraIcon(size = 20, color = '#2d3748') {
    return L.divIcon({
      className: 'camera-marker-wrapper',
      html: `<div class="camera-marker" style="--size:${size}px; background:${color};"><div class="camera-top"></div><div class="camera-lens"></div><div class="camera-flash"></div></div>`,
      iconSize: [size, size * 0.64],
      iconAnchor: [size / 2, (size * 0.64) / 2]
    });
  }

  // 載入照片圖層
  fetch("./photo.geojson")
    .then(res => res.json())
    .then(data => {
      const photoLayer = L.geoJSON(data, {
        pointToLayer: (f, latlng) => L.marker(latlng, { icon: createCameraIcon(20, '#383838') }),
        onEachFeature: (f, layer) => {
          layer.on("click", () => {
            const props = f.properties || {};
            document.getElementById("feature-title2").innerHTML = props.title || "未命名";
            document.querySelector("#point .modal-body").innerHTML = `
              <img src="${props.url || ''}" class="img-fluid rounded" style="max-height:70vh; object-fit:contain;" loading="lazy">
            `;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('point')).show();
          });
        }
      }).addTo(map);
      controlLayers.addOverlay(photoLayer, `<span style="font-size:16px;">📷</span> 竣工確認照片`);
    }).catch(() => console.warn("照片圖層 (photo.geojson) 載入失敗"));

  // 載入 hbar 圖層
  fetch("./hbar.geojson")
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        pointToLayer: (f, latlng) => L.marker(latlng, {
          icon: L.divIcon({ className: 'custom-plus-icon', html: '+', iconSize: [10, 10], iconAnchor: [5, 5] })
        }),
        onEachFeature: (f, layer) => {
          if (f.properties && f.properties.ID) layer.bindTooltip(f.properties.ID, { sticky: true });
        }
      }).addTo(map);
    }).catch(() => console.warn("hbar圖層載入失敗"));

  // --- Three.js 核心控制與記憶體回收機制 ---
  let threeAnimId = null;
  let activeRenderer = null;
  let activeScene = null;

  function onWindowResize() {
    const container = document.getElementById("threejs-container");
    if (!container || !activeRenderer) return;
    const camera = activeScene?.userData.camera;
    if (camera) {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
    }
    activeRenderer.setSize(container.clientWidth, container.clientHeight);
  }

  // 載入 3D 地形範圍（面圖層）
  fetch("./wa.geojson")
    .then(res => res.json())
    .then(data => {
      const terrainPolygonLayer = L.geoJSON(data, {
        style: () => ({ fillColor: '#4a90e2', weight: 2, opacity: 0.8, color: '#2b6cb0', fillOpacity: 0.3 }),
        onEachFeature: (f, layer) => {
          layer.bindTooltip("點擊查看該區 3D 地形圖", { sticky: true });
          layer.on("click", () => {
            const props = f.properties || {};
            document.getElementById("feature-title2").innerHTML = props.名稱 || "3D 測量地形圖";
            document.querySelector("#point .modal-body").innerHTML = `<div id="threejs-container"></div>`;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('point')).show();
            setTimeout(initThreeJSTerrain, 250);
          });
        }
      }).addTo(map);
      controlLayers.addOverlay(terrainPolygonLayer, `<span style="font-size:16px;">📐</span> 取土區`);
    }).catch(() => console.warn("地形範圍圖層 (wa.geojson) 載入失敗"));

  function initThreeJSTerrain() {
    const container = document.getElementById("threejs-container");
    if (!container) return;

    const width = container.clientWidth;
    const height = container.clientHeight;
    
    activeScene = new THREE.Scene();
    activeScene.background = new THREE.Color(0x222222);
    
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 2000);
    camera.position.set(0, 100, 150);
    activeScene.userData.camera = camera; // 將相機暫存在 scene 中方便 resize 存取

    activeRenderer = new THREE.WebGLRenderer({ antialias: true });
    activeRenderer.setSize(width, height);
    container.appendChild(activeRenderer.domElement);

    const controls = new THREE.OrbitControls(camera, activeRenderer.domElement);
    controls.maxPolarAngle = Math.PI / 2.1;
    controls.minDistance = 5;
    controls.maxDistance = 1000;

    activeScene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(100, 500, 100);
    activeScene.add(dirLight);

    const loader = new THREE.GLTFLoader();
    loader.load('./DEM.glb', function (gltf) {
      const terrain = gltf.scene;
      activeScene.add(terrain);
      
      const box = new THREE.Box3().setFromObject(terrain);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      controls.target.copy(center);
      camera.position.set(center.x, center.y + (size.y * 2) + 60, center.z + size.z * 1.5);
      controls.update();
    }, undefined, function (error) {
      console.error("3D 模型加載失敗，啟動備份方塊:", error);
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(30, 10, 30), new THREE.MeshNormalMaterial());
      activeScene.add(mesh);
      camera.position.set(0, 40, 60);
      controls.update();
    });

    function animate() {
      threeAnimId = requestAnimationFrame(animate);
      controls.update();
      if (activeRenderer && activeScene && camera) {
        activeRenderer.render(activeScene, camera);
      }
    }
    animate();

    window.addEventListener('resize', onWindowResize, false);
  }

  // 監聽 Modal 關閉：徹底銷毀 Three.js 實例與釋放記憶體
  document.getElementById('point').addEventListener('hidden.bs.modal', function () {
    window.removeEventListener('resize', onWindowResize, false);
    
    if (threeAnimId) {
      cancelAnimationFrame(threeAnimId);
      threeAnimId = null;
    }

    if (activeRenderer) {
      activeRenderer.dispose();
      const container = document.getElementById("threejs-container");
      if (container && activeRenderer.domElement) {
        container.removeChild(activeRenderer.domElement);
      }
      activeRenderer = null;
    }

    if (activeScene) {
      activeScene.traverse((object) => {
        if (!object.isMesh) return;
        object.geometry.dispose();
        if (object.material.isMaterial) {
          cleanMaterial(object.material);
        } else if (Array.isArray(object.material)) {
          object.material.forEach(cleanMaterial);
        }
      });
      activeScene = null;
    }
  });

  function cleanMaterial(material) {
    material.dispose();
    for (const key of Object.keys(material)) {
      if (material[key] && typeof material[key].dispose === 'function') {
        material[key].dispose();
      }
    }
  }
</script>
</body>
</html>
