<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水來愛造—即時水位監測與通報系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* 向量圖層與 SVG 動畫 */
    .taiwan-land {
      fill: #e0e0e0;
      stroke: #666;
      stroke-width: 1.5;
    }
    .basin-land {
      fill: #a2d5f2;
      fill-opacity: 0.6;
      stroke: #007acc;
      stroke-width: 1;
      cursor: pointer;
      transition: fill-opacity 0.2s, fill 0.2s, stroke-width 0.2s;
    }
    .basin-land:hover { fill-opacity: 0.95; }
    /* 警報顏色直接對接 BS5 主題色與變數 */
    .basin-land.alert-yellow { fill: #ffda6a; stroke: var(--bs-warning); fill-opacity: 0.8; }
    .basin-land.alert-orange { fill: var(--bs-orange); stroke: #c75a00; fill-opacity: 0.8; }
    .basin-land.alert-red    { fill: var(--bs-danger); stroke: #a71d2a; fill-opacity: 0.85; }
    .basin-land.highlighted {
      stroke: #000;
      stroke-width: 2.5;
      fill-opacity: 0.95;
    }
    .station-node {
      fill: var(--bs-danger);
      stroke: #fff;
      stroke-width: 1.5;
      cursor: pointer;
      transition: r 0.2s, fill 0.2s;
    }
    .station-node:hover, .station-node.selected {
      fill: #ff0000;
      r: 6;
    }
    svg#taiwan-svg {
      transition: viewBox 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }
    /* 動態 Tooltip */
    .basin-tooltip {
      background: rgba(0, 0, 0, 0.85);
      transform: translate(-50%, -120%);
    }
    /* 儀表條與指針細節 */
    .gauge-bar {
      height: 12px;
      box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.1);
    }
    .gauge-mark {
      position: absolute;
      transform: translateX(-50%);
      font-size: 0.7rem;
      white-space: nowrap;
    }
    .gauge-mark.mark-top { bottom: 18px; }
    .gauge-mark.mark-bottom { top: 18px; }
    .gauge-pointer {
      position: absolute;
      top: -8px;
      width: 4px;
      height: 28px;
      background-color: var(--bs-primary);
      border-radius: 2px;
      transform: translateX(-50%);
      transition: left 0.5s ease-out;
      display: none;
      z-index: 10;
    }
    /* 繪製指針下方的三角形箭頭 */
    .gauge-pointer::after {
      content: '';
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 10px solid var(--bs-primary);
    }
    .pointer-label {
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
    }
    /* 警戒燈號 */
    .status-light {
      width: 20px;
      height: 20px;
      background-color: var(--bs-secondary-bg-subtle);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    .light-normal    { background-color: var(--bs-success); box-shadow: 0 0 8px rgba(25, 135, 84, 0.7); }
    .light-warning-3 { background-color: var(--bs-warning); box-shadow: 0 0 8px rgba(255, 193, 7, 0.7); }
    .light-warning-2 { background-color: var(--bs-orange); box-shadow: 0 0 8px rgba(253, 126, 20, 0.7); }
    .light-warning-1 { background-color: var(--bs-danger); box-shadow: 0 0 8px rgba(220, 53, 69, 0.7); }
    /* 動態旋轉 */
    .transition-transform { transition: transform 0.2s ease-in-out; }
    /* 地圖圖例樣式 */
    .map-legend .legend-box {
      width: 14px;
      height: 14px;
      display: inline-block;
      border-radius: 2px;
      flex-shrink: 0;
      opacity: 0.8;
    }
    /* 推播清單頁籤 */
    .push-line-list-tabs .nav-link {
      color: #000;
      border: 2px solid transparent;
      border-radius: 6px;
      transition: all 0.15s ease-in-out;
    }
    /* 推播清單頁籤 Hover 狀態 */
    .push-line-list-tabs .nav-link:hover {
      background-color: #e9ecef;
      color: #000;
    }
    /* 推播清單頁籤 Active 啟用狀態 */
    .push-line-list-tabs .nav-link.active {
      background-color: gray;
      color: #ffffff;
      border-color: #333436;
    }
  </style>
  <div class="container-fluid h-100 p-0">
    <div class="row h-100 g-3">
      <!-- 左側控制面板 -->
      <div class="col-12 col-md-5 col-lg-8 d-flex flex-column h-100 gap-3">
        <!-- 搜尋區 -->
        <div class="card border-dark border-2 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="card-title h4 fw-bold mb-0">搜尋水位站</h2>
            </div>
            <div class="mb-2 d-flex align-items-center">
              <label for="basin-select" class="form-label fw-bold text-nowrap mb-0 me-2">選擇集水區：</label>
              <select id="basin-select" class="form-select form-select-sm" disabled>
                <option value="" class="text-center">-- 請稍候，載入中... --</option>
              </select>
            </div>
            <div class="mb-0 d-flex align-items-center">
              <label for="station-select" class="form-label fw-bold text-nowrap mb-0 me-2">選擇水位站：</label>
              <select id="station-select" class="form-select form-select-sm" disabled>
                <option value="" class="text-center">-- 請選擇水位站 --</option>
              </select>
            </div>
          </div>
        </div>
        <!-- 水位顯示區 -->
        <div class="card border-dark border-2 bg-white shadow-sm" id="station-info-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="d-flex align-items-center gap-2">
                <h3 class="card-title h4 fw-bold text-primary mb-0">即時水位顯示</h3>
                <button type="button" id="camera-button" class="d-none btn btn-sm btn-outline-primary align-items-center border-0 py-1 ms-5" title="觀看即時影像">
                  <i class="fa-solid fa-video fa-xl"></i> <span class="ms-1 fa-lg">即時影像</span>
                </button>
              </div>
              <!-- 水位警戒燈號 -->
              <div class="d-flex align-items-center gap-2">
                <span id="status-text" class="fw-bold text-muted"></span>
                <div id="status-light" class="status-light rounded-circle flex-shrink-0"></div>
              </div>
            </div>
            <div id="station-info" class="lh-base">
              <div class="text-muted small text-center py-4">請於搜尋區選擇或直接點擊地圖上的水位站...</div>
            </div>
            <!-- 動態水位警戒儀表區 (預設隱藏) -->
            <div id="gauge-container" class="mt-3 pt-2" style="display: none;">
              <div class="position-relative my-4 mx-2">
                <!-- 水位指針 -->
                <div class="gauge-pointer" id="gauge-pointer">
                  <div class="pointer-label position-absolute bg-primary text-white rounded px-1 text-nowrap">現在</div>
                </div>
                <div id="gauge-bar" class="gauge-bar bg-body-secondary rounded-pill position-relative overflow-hidden"></div>
                <div id="gauge-marks"></div>
              </div>
            </div>
          </div>
        </div>
        <!-- 推播清單與頁籤區 -->
        <div id="search_area" class="flex-grow-1 d-flex flex-column h-100 overflow-hidden">
          <div class="card border-dark border-2 flex-grow-1 d-flex flex-column bg-white shadow-sm min-vh-0 overflow-hidden">
            <!-- 切換清單頁籤 -->
            <div class="card-header bg-light border-bottom border-dark border-2 p-1 flex-shrink-0">
              <ul class="nav nav-pills nav-justified push-line-list-tabs" id="uploadTabs" role="tablist">
                <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold py-2" id="line-tab" data-bs-toggle="tab" data-bs-target="#line-panel" type="button" role="tab">
                  <i class="fa-brands fa-line me-2" style="color: #06C755;"></i> Line 推播清單
                </button>
                </li>
                <li class="nav-item me-0" role="presentation">
                  <button class="nav-link fw-bold py-2" id="discord-tab" data-bs-toggle="tab" data-bs-target="#discord-panel" type="button" role="tab">
                    <i class="fa-brands fa-discord me-2" style="color: #5865F2;"></i> Discord 推播清單
                  </button>
                </li>
              </ul>
            </div>
            <!-- 頁籤內容主容器 -->
            <div class="tab-content card-body p-3 overflow-y-auto flex-grow-1 min-vh-0" id="uploadTabContent">
              <!-- 頁籤 1: Line 推播清單 -->
              <div class="tab-pane fade show active h-100" id="line-panel" role="tabpanel">
                <div id="line-channel-container" class="mb-2">
                  <div class="input-group"></div>
                </div>
                <div id="push-line-list-container" class="d-flex flex-column gap-2"></div> <!-- 動態推播清單區 -->
              </div>
              <!-- 頁籤 2: Discord 推播清單 -->
              <div class="tab-pane fade h-100" id="discord-panel" role="tabpanel">
                <div id="discord-channel-container" class="mb-2">
                  <div class="input-group"></div>
                </div>
                <div id="push-discord-list-container" class="d-flex flex-column gap-2"></div> <!-- 動態推播清單區 -->
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- 右側 SVG 顯示區 -->
      <div class="col-12 col-md-7 col-lg-4 d-flex h-100">
        <div class="card border-dark border-2 h-100 shadow-sm overflow-hidden position-relative" id="map-container">
          <button id="reset-zoom-btn" class="btn btn-dark btn-sm position-absolute top-0 start-0 m-2 m-md-3 shadow-sm z-3 fw-bold" onclick="resetMapZoom()">↻ 重設全圖</button>
          <span class="d-flex position-absolute bottom-0 start-0 badge bg-secondary rounded-pill m-1 m-md-2 z-3 opacity-75">
            更新時間：<div id="update-time">-/-- --午-:--:--</div>
          </span>
          <!-- 滑鼠懸停 Tooltip -->
          <div class="basin-tooltip position-absolute pe-none text-white rounded px-2 py-1 small fw-bold text-nowrap shadow-sm z-3 d-none" id="basin-tooltip"></div>
          <svg id="taiwan-svg" class="w-100 h-100 d-block"></svg>
          <!-- 警戒分級圖例 -->
          <div class="map-legend position-absolute bottom-0 end-0 m-2 m-md-3 p-2 bg-white bg-opacity-75 rounded shadow-sm z-3 border" style="backdrop-filter: blur(2px);">
            <div class="fw-bold mb-1 extra-small text-muted text-center" style="font-size: 0.75rem;">警戒分級</div>
            <div class="d-flex flex-column gap-1 extra-small" style="font-size: 0.75rem;">
              <div class="d-flex align-items-center gap-2">
                <span class="legend-box" style="background-color: #a2d5f2; border: 1px solid #007acc;"></span> <span>正常水位</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span class="legend-box" style="background-color: #ffda6a; border: 1px solid var(--bs-warning);"></span> <span>三級警戒</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span class="legend-box" style="background-color: var(--bs-orange); border: 1px solid #c75a00;"></span> <span>二級警戒</span>
              </div>
              <div class="d-flex align-items-center gap-2">
                <span class="legend-box" style="background-color: var(--bs-danger); border: 1px solid #a71d2a;"></span> <span>一級警戒</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- CCTV 即時影像 Modal -->
  <div class="modal fade" id="cctv-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow">
        <div class="modal-header bg-dark text-white p-2 px-3">
          <h5 class="modal-title fs-5 fw-bold" id="cctv-modal-title">即時影像</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-3 text-center bg-light">
          <!-- 鏡頭切換選單區 (有多個鏡頭時動態顯示) -->
          <div id="cctv-select-container" class="mb-3 d-none align-items-center justify-content-center gap-2 px-3 py-1-5 bg-body-tertiary rounded-pill border">
            <span class="badge rounded-pill bg-primary-subtle text-primary fw-normal me-3">切換CCTV</span>
            <!-- <label for="cctv-camera-select" class="form-label fw-semibold mb-0 ms-0 text-nowrap small">鏡頭</label> -->
            <select id="cctv-camera-select" class="form-select form-select-sm w-auto border-0 bg-transparent fw-bold text-primary focus-ring-none"></select> <!-- 動態選單選項 -->
          </div>
          <!-- 影像顯示容器 -->
          <div class="ratio ratio-16x9 overflow-hidden rounded border bg-black">
            <img id="cctv-image-display" src="" class="object-fit-cover" alt="CCTV 即時影像">
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='https://joe123890508.github.io/Geotextile_Tube/water_level.js') }}"></script>
</body>
</html>
